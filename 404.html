<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="origin">
<title>Вход VK для бота YouTube → VK Видео</title>
<style>
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f4f5f7; color: #1f2328;
         margin: 0; padding: 24px 16px; line-height: 1.5; }
  main { max-width: 560px; margin: 0 auto; background: #fff; border-radius: 14px; padding: 24px;
         box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  h1 { font-size: 22px; margin: 0 0 12px; }
  p { margin: 10px 0; }
  .btn { display: block; width: 100%; box-sizing: border-box; text-align: center; border: 0; border-radius: 10px;
         padding: 14px; font-size: 17px; font-weight: 600; cursor: pointer; text-decoration: none; margin: 14px 0; }
  .vk { background: #0077ff; color: #fff; }
  .gh { background: #1f883d; color: #fff; }
  .sec { background: #eaeef2; color: #1f2328; }
  textarea { width: 100%; box-sizing: border-box; height: 120px; font: 13px ui-monospace, monospace; border-radius: 8px;
             border: 1px solid #d0d7de; padding: 8px; word-break: break-all; }
  .err { color: #cf222e; }
  .ok { color: #1a7f37; }
  ol { padding-left: 20px; }
  @media (prefers-color-scheme: dark) {
    body { background: #0d1117; color: #e6edf3; } main { background: #161b22; }
    .sec { background: #30363d; color: #e6edf3; } textarea { background: #0d1117; color: #e6edf3; border-color: #30363d; }
  }
</style>
</head>
<body>
<main id="app"><h1>Загрузка…</h1></main>
<script>
(function () {
  var WORKFLOW = "https://github.com/jyik347-cloud/ggvp/actions/workflows/vk-login.yml";
  var ALLOWED_HOSTS = ["id.vk.ru", "id.vk.com"];
  var app = document.getElementById("app");
  var q = new URLSearchParams(location.search);
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return "&#" + c.charCodeAt(0) + ";"; }); }

  if (q.get("code")) {
    // Шаг 2: VK вернул код — показываем адрес, который нужно вставить в GitHub.
    var full = location.href;
    app.innerHTML =
      '<h1 class="ok">✅ VK разрешил доступ</h1>' +
      '<p>Осталось передать этот адрес боту. Код действует <b>10 минут</b>.</p>' +
      '<textarea id="u" readonly></textarea>' +
      '<button class="btn sec" id="copy">📋 Скопировать адрес</button>' +
      '<ol><li>Нажми зелёную кнопку ниже.</li>' +
      '<li>На GitHub нажми <b>Run workflow</b>, вставь адрес в поле и снова нажми <b>Run workflow</b>.</li></ol>' +
      '<a class="btn gh" href="' + WORKFLOW + '" target="_blank" rel="noopener">Открыть «VK — вход» на GitHub</a>' +
      '<p style="font-size:13px;opacity:.7">Никому, кроме GitHub, этот адрес не отправляй.</p>';
    var ta = document.getElementById("u");
    ta.value = full;
    document.getElementById("copy").onclick = function () {
      var btn = this;
      function done() { btn.textContent = "✅ Скопировано"; }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(full).then(done, function () { ta.select(); document.execCommand("copy"); done(); });
      } else { ta.select(); document.execCommand("copy"); done(); }
    };
    return;
  }

  if (q.get("error")) {
    app.innerHTML = '<h1 class="err">VK вернул ошибку</h1><p><b>' + esc(q.get("error")) + '</b></p><p>' +
      esc(q.get("error_description") || "") + '</p><p>Сделай скриншот этой страницы и пришли его.</p>';
    return;
  }

  var go = q.get("go");
  if (go) {
    // Шаг 1: открываем вход VK с этого сайта (VK ID проверяет, что вход открыт с базового домена).
    var url;
    try { url = new URL(go); } catch (e) { url = null; }
    if (!url || url.protocol !== "https:" || ALLOWED_HOSTS.indexOf(url.hostname) < 0 || url.pathname !== "/authorize") {
      app.innerHTML = '<h1 class="err">Неверная ссылка</h1><p>Получи новую ссылку: запусти «VK — вход» на GitHub с пустым полем.</p>';
      return;
    }
    app.innerHTML =
      '<h1>Вход в VK для бота</h1>' +
      '<p>Нажми кнопку, войди в VK с аккаунта, который управляет группой, и нажми <b>«Разрешить»</b>.</p>' +
      '<a class="btn vk" id="go" referrerpolicy="origin">Войти через VK</a>' +
      '<p style="font-size:13px;opacity:.7">После «Разрешить» ты вернёшься на эту страницу, и она покажет, что делать дальше.</p>';
    document.getElementById("go").href = url.href;
    return;
  }

  app.innerHTML =
    '<h1>Вход в VK для бота YouTube → VK Видео</h1>' +
    '<p>Чтобы получить ссылку для входа, запусти на GitHub <b>«VK — вход»</b> с пустым полем ' +
    'и открой ссылку из раздела Summary.</p>' +
    '<a class="btn gh" href="' + WORKFLOW + '" target="_blank" rel="noopener">Открыть «VK — вход» на GitHub</a>';
})();
</script>
</body>
</html>
